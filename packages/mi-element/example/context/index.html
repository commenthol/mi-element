<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mi-element context example</title>
    <meta name="Description" content="mi-element controller example" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#16161d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>
      pre {
        padding: 0.5em;
        background-color: rgba(0, 0, 0, 0.7);
        color: #fff;
      }
    </style>
  </head>

  <body>
    <h1>mi-element context example</h1>
    <mi-context-provider context="outer" value="-1">
      <mi-context-provider value="3">
        <div>
          <mi-context-consumer>
            <!-- 3 -->
          </mi-context-consumer>
        </div>
        <div>
          <mi-context-consumer context="outer">
            <!-- 0 -->
          </mi-context-consumer>
        </div>
      </mi-context-provider>
      <div>
        <mi-context-consumer context="outer">
          <!-- 0 -->
        </mi-context-consumer>
      </div>
    </mi-context-provider>
    <script type="module" src="./context.js"></script>
  </body>
</html>
